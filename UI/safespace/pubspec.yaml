name: safespace
description: A mental wellness Flutter app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  intl_phone_field: ^3.2.0
  fl_chart: ^0.66.0
  intl: ^0.18.1
  http: ^1.1.0
  shared_preferences: ^2.2.2
  speech_to_text: ^7.3.0
  supabase_flutter: ^2.14.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/onboarding_1.jpg
    - assets/onboarding_2.jpg
    - assets/onboarding_3.png
